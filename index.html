<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIVINE.NET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff; --dim:#1c1c1c; color-scheme:dark;
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --text:"Onest","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:1rem;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1,h2{font-family:var(--display);margin:0}
h1{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% auto;animation:shimmer 3.2s linear infinite;background-image:linear-gradient(90deg,#fff,#000,#fff,#000,#fff)}

.ava{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--fg);background-color:var(--bg);background-size:cover;background-position:center;display:grid;place-items:center;font-family:var(--display);font-size:1rem;padding:0;overflow:hidden}
.ava.s{width:2rem;height:2rem;font-size:.8rem}
.ava.l{width:6rem;height:6rem;font-size:2.2rem}
button.ava:hover{background-color:var(--dim)}

.btn{background:var(--fg);color:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.6rem 1.3rem;font-weight:500}
.btn:hover{background:var(--bg);color:var(--fg)}
.btn.ghost{background:none;color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.btn.full{width:100%}
.sm{background:none;border:2px solid var(--fg);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;line-height:1.2;min-height:2.3rem;white-space:nowrap;flex:none}
.sm:hover,.sm[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.sm.danger{border-color:#ff4d4d;color:#ff4d4d}
.sm.danger:hover{background:#ff4d4d;color:#fff;border-color:#ff4d4d}

.top-actions{position:absolute;top:1rem;right:1rem;z-index:2;display:flex;gap:.4rem}
.top-actions .sm{font-size:.75rem;padding:.2rem .55rem;min-height:auto;letter-spacing:.05em}
.top-actions .sm.icon-btn{font-family:var(--display);font-weight:800;font-size:.85rem;padding:.2rem .5rem}

.auth,.modal{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;place-items:center;padding:1.25rem;overflow-y:auto;overflow-x:hidden}
.auth::before{content:"";position:fixed;top:50%;left:50%;width:130vmin;height:130vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 28%,transparent 62%);filter:blur(60px);pointer-events:none;animation:authHalo 5.5s ease-in-out infinite}
@keyframes authHalo{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.modal{background:rgba(0,0,0,.88);z-index:8}
.card{width:100%;max-width:24rem;border:2px solid var(--fg);border-radius:1.1rem;padding:1.75rem;background:var(--bg)}
.card.wide{max-width:min(92vw,34rem)}
.auth .card{position:relative;z-index:1;background:rgba(8,8,8,.6);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 60px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.04);animation:cardGlow 4s ease-in-out infinite}
@keyframes cardGlow{0%,100%{box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 50px rgba(255,255,255,.05),0 0 90px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.04)}50%{box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 90px rgba(255,255,255,.13),0 0 160px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.07)}}
.card h1{font-weight:800;font-size:1.8rem;letter-spacing:-.03em;margin-bottom:.4rem}
.card h2{font-weight:800;font-size:1.3rem;margin-bottom:.6rem}
.card p{margin:0 0 1.25rem;opacity:.75}
.card .err{min-height:1.4rem;margin:0 0 .6rem;font-weight:500;opacity:1;transition:color .2s ease}
.card .note{font-size:.85rem;opacity:.7;margin:1rem 0 0}
.tabs{display:flex;border:2px solid var(--fg);border-radius:999px;margin-bottom:1.25rem;overflow:hidden}
.tabs button{flex:1;background:transparent;border:0;padding:.55rem;font-weight:500;transition:background .28s ease,color .28s ease,transform .15s ease}
.tabs button:active{transform:scale(.97)}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg)}
.card label{display:block;font-weight:500;margin-bottom:.9rem;max-height:120px;opacity:1;overflow:clip;overflow-clip-margin:8px;transform:translateY(0);transition:opacity .28s cubic-bezier(.2,.7,.3,1),max-height .35s cubic-bezier(.2,.7,.3,1),margin-bottom .3s cubic-bezier(.2,.7,.3,1),transform .3s cubic-bezier(.2,.7,.3,1)}
.card label.off{max-height:0;opacity:0;margin-bottom:0;transform:translateY(-8px);pointer-events:none}
.card input:not([type=file]),.card textarea{display:block;width:100%;margin-top:.3rem;border:2px solid var(--fg);border-radius:.7rem;padding:.65rem .9rem;background:var(--bg);resize:vertical}
.eye{margin-bottom:.9rem}
#authBtn{transition:opacity .16s ease,transform .18s ease,background .2s ease,color .2s ease}
#adminView{animation:adminIn .32s cubic-bezier(.2,.7,.3,1)}
@keyframes adminIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.adl{margin:0 0 1.25rem;max-height:40vh;overflow-y:auto;border:2px solid var(--fg);border-radius:.7rem}
.adl li{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;border-bottom:1px solid var(--fg)}
.adl li:last-child{border-bottom:0}
.adl li span.n{flex:1;min-width:0;overflow-wrap:anywhere}

.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;margin-bottom:1rem}
.pf p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;opacity:.7}
.pbanner{margin:-1.75rem -1.75rem 0;height:7.5rem;background-size:cover;background-position:center;border-radius:calc(1.1rem - 2px) calc(1.1rem - 2px) 0 0;border-bottom:2px solid var(--fg)}
.pbanner.none{height:3.5rem;display:grid;place-items:center;font-size:.85rem;opacity:.7;border-bottom:2px dashed var(--fg)}
.pf.withb{margin-top:-3.4rem}
.pf.withb .ava.l{border-width:3px;box-shadow:0 0 0 3px var(--bg)}
.bnote{font-size:.85rem;opacity:.75;margin:.8rem 0 .4rem}
.glyphs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 1rem}
.g{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--fg);background:none;font-size:1.1rem}
.g:hover,.g[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:.6rem;margin-top:.5rem}
.row .btn{flex:1}

.info-row{display:flex;align-items:flex-start;gap:.7rem;padding:.6rem 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.info-row:last-child{border-bottom:0}
.info-row .info-text{flex:1;min-width:0;font-size:.88rem;line-height:1.4;opacity:.9}
.info-section{margin-top:1rem}
.info-section h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 .5rem;padding-top:.8rem;border-top:2px solid var(--fg)}
.info-section:first-of-type h3{border-top:0;padding-top:0}
.role-badge{display:inline-block;padding:.15rem .6rem;border:2px solid;border-radius:999px;font-weight:600;font-size:.75rem;letter-spacing:.02em;white-space:nowrap;flex:none;font-family:var(--display);line-height:1.35}
.role-user{color:#fff;border-color:#fff;background:rgba(255,255,255,.06)}
.role-mod{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% auto;animation:shimmer 3.2s linear infinite;background-image:linear-gradient(90deg,#2f7bff,#a8ccff,#2f7bff,#a8ccff,#2f7bff);border-color:#2f7bff}
.role-admin{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% auto;animation:shimmer 3.2s linear infinite;background-image:linear-gradient(90deg,#ff3b3b,#ffb0b0,#ff3b3b,#ffb0b0,#ff3b3b);border-color:#ff3b3b}
.ping-badge{display:inline-block;padding:.15rem .55rem;border-radius:.4rem;font-weight:600;font-size:.82rem;white-space:nowrap;flex:none;font-family:var(--text)}
.ping-everyone{color:#fbbf24;background:rgba(251,191,36,.18)}
.ping-user{color:#c084fc;background:rgba(168,85,247,.18)}
.ping-msg{color:#fff;background:rgba(255,255,255,.1)}
.ping-hl{width:1.1rem;height:1.1rem;border-radius:50%;flex:none}
.ping-hl.white{background:linear-gradient(90deg,#fff,#c8c8c8,#fff)}
.ping-hl.purple{background:linear-gradient(90deg,#a855f7,#e879f9,#c084fc)}
.ping-hl.yellow{background:linear-gradient(90deg,#fbbf24,#fde68a,#fbbf24)}

.app{display:grid;grid-template-columns:300px 1fr 240px;height:100%;border:2px solid var(--fg)}
.mem{border-left:2px solid var(--fg);display:flex;flex-direction:column;min-height:0}
.mem h2{font-family:var(--text);font-weight:500;font-size:.95rem;padding:1.1rem 1.1rem .5rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.mlist{flex:1;overflow-y:auto;padding:0 .6rem .8rem}
.mlist button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;border-radius:.6rem;padding:.4rem .5rem}
.mlist button:hover{background:var(--dim)}
.mlist .t{display:flex;flex-direction:column;min-width:0}
.mlist .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist small{font-size:.78rem;opacity:.7}
.mlist li.off .nmx{opacity:.6}
.st{position:relative;flex:none;display:block}
.st::after{content:"";position:absolute;right:-3px;bottom:-3px;width:.85rem;height:.85rem;border-radius:50%;background:#808080;border:2px solid var(--bg)}
.st.on::after{background:#23c552}
.memx,.membtn{display:none}
.adm,.mod{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% auto;animation:shimmer 3.2s linear infinite}
.adm{background-image:linear-gradient(90deg,#ff3b3b,#ffb0b0,#ff3b3b,#ffb0b0,#ff3b3b)}
.mod{background-image:linear-gradient(90deg,#2f7bff,#a8ccff,#2f7bff,#a8ccff,#2f7bff)}
.adm .bdg,.mod .bdg{color:var(--fg);-webkit-text-fill-color:var(--fg)}
@keyframes shimmer{from{background-position:0% center}to{background-position:300% center}}
@media (prefers-reduced-motion:reduce){.adm,.mod,.role-admin,.role-mod,h1{animation:none}h1{background-image:linear-gradient(90deg,#fff,#888,#fff)}.list li.unread button::before,.list li.mention-unread button::before,.list li.everyone-unread button::before{animation:none}}
.bdg{display:inline-block;border:2px solid var(--fg);border-radius:999px;padding:0 .45rem;font-size:.7rem;line-height:1.35;margin-left:.4rem;font-weight:500}
.m .b{flex:1}
.mlist li{display:flex;align-items:center;gap:.3rem}
.mlist li>button:first-child{flex:1;min-width:0}
.mlist .nline{display:flex;align-items:center;min-width:0}
.mi{display:inline-flex;align-items:center;flex:none;margin-left:.4rem;color:var(--fg);-webkit-text-fill-color:var(--fg);opacity:.85}
.m .h .mi{align-self:center;margin-left:0}
.card h2 .mi svg{width:18px;height:18px}
.mlist .hd{padding:.8rem .5rem .3rem;font-size:.85rem;opacity:.7}
.mlist .bn{flex:1;padding:.4rem .5rem}
.adl li{flex-wrap:wrap}
.acts{flex-basis:100%;display:flex;gap:.4rem;flex-wrap:wrap;padding-left:2.6rem}
.clip{display:grid;place-items:center;padding:.6rem .9rem}
.locked{padding:.95rem 1.25rem;text-align:center;font-weight:500;border-top:2px solid var(--fg)}
.serr{margin:0;padding:.5rem 1.25rem;font-weight:500;border-top:2px solid var(--fg)}
.prev{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.25rem;border-top:2px solid var(--fg)}
.prev img{height:3.5rem;border-radius:.5rem;border:2px solid var(--fg)}
.picb{background:none;border:0;padding:0;display:block;margin-top:.3rem;cursor:zoom-in}
.pic{display:block;max-width:min(100%,360px);max-height:360px;border:2px solid var(--fg);border-radius:.8rem}
.big{display:block;max-width:100%;max-height:75vh;margin:0 auto;border-radius:.6rem}
.apanel{border:2px solid var(--fg);border-radius:.8rem;padding:.9rem;margin:0 0 1rem;text-align:left}
.apanel h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 .6rem}
.apanel .st2{margin:0 0 .5rem;opacity:1;font-weight:500}
.row2{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}
select,.apanel input[type=number]{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.35rem .9rem;min-height:2.3rem;line-height:1.2}
.apanel input[type=number]{width:5.5rem}
.apanel input,.apanel select,.apanel button{flex:none}
.side{border-right:2px solid var(--fg);display:flex;flex-direction:column;min-height:0;position:relative}
.side h1{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding:1.1rem 1.25rem;border-bottom:2px solid var(--fg)}
.cat{padding:.9rem 1.25rem .3rem;font-size:.85rem;font-weight:500;opacity:.7}
.list .cat{padding:.9rem .7rem .3rem}
.list{flex:1;overflow-y:auto;padding:0 .6rem}
.list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:.6rem;padding:.6rem .7rem;font-weight:500}
.list button:hover{background:var(--dim)}
.list li.on button{background:var(--fg);color:var(--bg)}
.list li.unread button{position:relative}
.list li.unread button::before{content:"";position:absolute;inset:0;padding:2px;border-radius:.6rem;background:linear-gradient(90deg,#fff,#c8c8c8,#fff,#c8c8c8,#fff);background-size:300% 100%;animation:shimmer 3.2s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.list li.mention-unread button{position:relative}
.list li.mention-unread button::before{content:"";position:absolute;inset:0;padding:2px;border-radius:.6rem;background:linear-gradient(90deg,#a855f7,#e879f9,#c084fc,#e879f9,#a855f7);background-size:300% 100%;animation:shimmer 3.2s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.list li.everyone-unread button{position:relative}
.list li.everyone-unread button::before{content:"";position:absolute;inset:0;padding:2px;border-radius:.6rem;background:linear-gradient(90deg,#fbbf24,#fde68a,#fbbf24,#fde68a,#fbbf24);background-size:300% 100%;animation:shimmer 3.2s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#dmlist{max-height:40vh;flex:none;border-top:2px solid var(--fg)}
.me{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-top:2px solid var(--fg)}
.mebtn{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;background:none;border:0;padding:.2rem;text-align:left;border-radius:.6rem}
.mebtn:hover{background:var(--dim)}
#who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:.5rem;padding:.9rem 1.25rem;border-bottom:2px solid var(--fg);flex-wrap:wrap}
.ttl{display:flex;align-items:baseline;gap:.8rem;min-width:0;flex:1 1 auto}
.top b{font-family:var(--display);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{opacity:.7;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:none;background:none;border:2px solid var(--fg);border-radius:50%;width:2.4rem;height:2.4rem;padding:0;place-items:center;flex:none;min-width:2.4rem}
.msgs{flex:1;overflow-y:auto;padding:1rem 1.25rem;position:relative}
.m{display:flex;gap:.8rem;padding:.45rem .6rem;position:relative;transition:background .15s,transform .15s;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:.6rem;margin:0 -.6rem}
.m:hover,.m.open-actions{background:rgba(255,255,255,.05)}
.m .b{min-width:0;flex:1}
.m .h{display:flex;align-items:baseline;gap:.5rem}
.nm{background-color:transparent;border:0;padding:0;font-weight:500}
.m .nm:hover,.fcard .nm:hover{text-decoration:underline;text-decoration-color:var(--fg)}
.m time{font-size:.78rem;opacity:.6}
.m p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.mention{color:#c084fc;background:rgba(168,85,247,.15);border-radius:.3rem;padding:0 .2rem;font-weight:500}
.mention.everyone-mention{color:#fbbf24;background:rgba(251,191,36,.18)}
.m.highlight{background:rgba(168,85,247,.18);animation:hlPulse 1.2s ease-out}
@keyframes hlPulse{0%{background:rgba(168,85,247,.5)}100%{background:rgba(168,85,247,.18)}}
.m .reply-quote{display:flex;flex-direction:column;gap:.15rem;padding:.35rem .6rem;margin-bottom:.3rem;border-left:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.05);border-radius:.4rem;cursor:pointer;max-width:100%;transition:background .15s}
.m .reply-quote:hover{background:rgba(255,255,255,.1)}
.m .reply-quote .rq-name{font-size:.78rem;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .reply-quote .rq-text{font-size:.82rem;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-actions{position:absolute;right:.4rem;top:.3rem;display:flex;gap:.3rem;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2;background:rgba(8,8,8,.75);backdrop-filter:blur(6px);padding:.15rem;border-radius:.5rem}
.m:hover .m-actions,.m.open-actions .m-actions,.m .m-actions:focus-within{opacity:1;pointer-events:auto}
.m-act-btn{width:1.9rem;height:1.9rem;padding:0;display:grid;place-items:center;border:2px solid var(--fg);border-radius:50%;background:var(--bg);color:var(--fg);font-size:.95rem;line-height:1;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.m-act-btn:hover{background:var(--fg);color:var(--bg)}
.m-act-btn.danger{border-color:#ff4d4d;color:#ff4d4d}
.m-act-btn.danger:hover{background:#ff4d4d;color:#fff;border-color:#ff4d4d}
.m-act-btn.emoji{font-size:1rem;font-family:var(--text)}
.empty{margin:2rem auto;text-align:center;opacity:.7}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fcard{border:2px solid var(--fg);border-radius:1rem;padding:.9rem 1rem;margin:0 0 .8rem;display:flex;flex-direction:column;gap:.5rem;transition:background .15s,transform .15s}
.fcard:hover{background:var(--dim)}
.fcard .fh{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.fcard time{font-size:.78rem;opacity:.6}
.fcard .fp{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fcard .pic{max-width:min(100%,400px);max-height:300px;border:0;margin-top:.2rem;border-radius:.6rem}
.fcard .actions{display:flex;justify-content:flex-end;margin-top:.3rem}
.fcard .delmsg{opacity:.5;margin:0;align-self:auto}
.fcard:hover .delmsg,.fcard .delmsg:focus-visible{opacity:1}
.fptitle{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:.2rem 0;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}
.card .fptitle{font-size:1.3rem;margin:.3rem 0 .5rem}
.sendbar{display:flex;gap:.6rem;padding:.8rem 1.25rem;border-top:2px solid var(--fg);flex-wrap:wrap}
#input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.65rem 1.1rem}
.sendbar .send-wrap{display:flex;gap:.6rem;flex:1;min-width:0;align-items:center}
.reply-preview{display:flex;align-items:center;gap:.6rem;padding:.4rem 1.25rem;border-top:2px solid var(--fg);background:rgba(168,85,247,.08)}
.reply-preview .rp-bar{width:3px;background:#a855f7;border-radius:2px;height:100%;min-height:2rem;flex:none}
.reply-preview .rp-body{flex:1;min-width:0;font-size:.85rem}
.reply-preview .rp-name{font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c084fc}
.reply-preview .rp-text{opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-preview .rp-close{flex:none;background:none;border:2px solid var(--fg);border-radius:50%;width:1.9rem;height:1.9rem;padding:0;display:grid;place-items:center;font-size:.9rem}
.reply-preview .rp-close:hover{background:var(--fg);color:var(--bg)}

  function renderTextWithMentions(container, text){
    container.innerHTML="";
    var re = /@([A-Za-zА-Яа-яЁё0-9_.-]{2,24})/g;
    var last = 0, m;
    while((m = re.exec(text)) !== null){
      if(m.index>last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
      var sp = document.createElement("span");
      if(m[1].toLowerCase() === "everyone"){ sp.className = "mention everyone-mention"; sp.textContent = "@everyone"; }
      else { sp.className = "mention"; sp.textContent = "@"+m[1]; }
      container.appendChild(sp);
      last = m.index + m[0].length;
    }
    if(last<text.length) container.appendChild(document.createTextNode(text.slice(last)));
  }

  function toggleReaction(m, emoji){
    if(!me||!fbReady) return;
    var coll = dmUser ? fbdb.collection("dms").doc(dmUser).collection("messages") : fbdb.collection("channels").doc(cur).collection("messages");
    var ref = coll.doc(m.id);
    fbdb.runTransaction(function(tx){
      return tx.get(ref).then(function(doc){
        if(!doc.exists) throw new Error("no doc");
        var data = doc.data() || {};
        var reactions = data.reactions || {};
        var users = (reactions[emoji] || []).slice();
        var idx = users.indexOf(me.key);
        if(idx > -1) users.splice(idx, 1);
        else users.push(me.key);
        var newReactions = {};
        Object.keys(reactions).forEach(function(k){ if(k!==emoji) newReactions[k] = reactions[k]; });
        if(users.length > 0) newReactions[emoji] = users;
        tx.update(ref, {reactions: newReactions});
      });
    }).catch(function(e){ console.error("reaction:",e); });
  }

  function attachMsgHandlers(row, m){
    if(!row || !m || !m.id) return;
    row.addEventListener("contextmenu", function(e){ e.preventDefault(); openCtxMenu(e.clientX, e.clientY, m); });
    var startX=0, startY=0, active=false, done=false, threshold=60;
    var lpTimer=null, lpMoved=false, lpStarted=false;
    row.addEventListener("touchstart", function(e){
      if(e.touches.length!==1) return;
      startX=e.touches[0].clientX; startY=e.touches[0].clientY;
      active=true; done=false; lpMoved=false; lpStarted=false;
      var tx=startX, ty=startY;
      lpTimer=setTimeout(function(){
        if(!lpMoved && active){
          lpStarted=true; openCtxMenu(tx, ty, m);
          if(navigator.vibrate) try{ navigator.vibrate(20); }catch(e){}
        }
      }, 500);
    }, {passive:true});
    row.addEventListener("touchmove", function(e){
      if(!active) return;
      var dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
      if(Math.abs(dx)>10 || Math.abs(dy)>10) lpMoved=true;
      if(Math.abs(dy)>30 || lpStarted){ active=false; clearTimeout(lpTimer); return; }
      if(dx>threshold && Math.abs(dy)<40 && !done){ row.style.transform="translateX("+Math.min(dx-40, 40)+"px)"; }
      if(dx>100 && !done){ done=true; row.style.transform=""; setReply(m); active=false; clearTimeout(lpTimer); }
    }, {passive:true});
    row.addEventListener("touchend", function(){ row.style.transform=""; clearTimeout(lpTimer); active=false; }, {passive:true});
    row.addEventListener("touchcancel", function(){ row.style.transform=""; clearTimeout(lpTimer); active=false; }, {passive:true});
  }

  function deleteDM(userKey){
    var acc=getAcc(userKey); var nm=(acc&&acc.name)||userKey;
    if(!confirm(t('del_dm_confirm')+nm+t('del_dm_confirm2'))) return;
    var ref=fbdb.collection("dms").doc(userKey);
    ref.collection("messages").get().then(function(snap){
      var docs=[]; snap.forEach(function(d){ docs.push(d); });
      if(!docs.length) return;
      var batches=[];
      for(var i=0; i<docs.length; i+=450){ var b=fbdb.batch(); docs.slice(i,i+450).forEach(function(d){ b.delete(d.ref); }); batches.push(b.commit()); }
      return Promise.all(batches);
    }).then(function(){ return ref.delete(); })
    .then(function(){ if(dmUser===userKey) closeDM(); })
    .catch(function(e){ console.error("delete dm:",e); alert(t('failed_del_dm')+e.message); });
  }
  function clearChannel(channelId){
    if(!confirm(t('clear_ch_confirm')+channelId+t('clear_ch_confirm2'))) return;
    var serr=$("serr"); serr.textContent=t('clearing'); serr.hidden=false;
    var ref=fbdb.collection("channels").doc(channelId).collection("messages");
    ref.get().then(function(snap){
      var docs=[]; snap.forEach(function(d){ docs.push(d); });
      if(!docs.length){ serr.hidden=true; serr.textContent=""; return; }
      var commentJobs = docs.map(function(d){
        return d.ref.collection("comments").get().then(function(cs){
          var refs=[]; cs.forEach(function(c){ refs.push(c.ref); });
          if(!refs.length) return;
          var batches=[];
          for(var i=0; i<refs.length; i+=450){ var b=fbdb.batch(); refs.slice(i,i+450).forEach(function(r){ b.delete(r); }); batches.push(b.commit()); }
          return Promise.all(batches);
        }).catch(function(){});
      });
      return Promise.all(commentJobs).then(function(){
        var batches=[];
        for(var i=0; i<docs.length; i+=450){ var b=fbdb.batch(); docs.slice(i,i+450).forEach(function(d){ b.delete(d.ref); }); batches.push(b.commit()); }
        return Promise.all(batches);
      });
    }).then(function(){
      data[channelId]=[]; loadedCh[channelId]=true; replyTo=null; updateReplyPreview();
      serr.hidden=true; serr.textContent=""; renderMsgs(true);
    }).catch(function(e){
      console.error("clear:",e);
      serr.textContent=t('failed_clear')+e.message; serr.hidden=false;
      setTimeout(function(){ serr.hidden=true; serr.textContent=""; },5000);
    });
  }

    var r1=el("div","row2");
    if(mu){
      var um=el("button","sm",t('unmute')); um.type="button";
      um.onclick=function(){ fbdb.collection("mutes").doc(key).delete().then(reopen).catch(fail); };
      r1.appendChild(um);
    }else{
      var num=el("input"); num.type="number"; num.min="1"; num.max="9999"; num.value="10"; num.setAttribute("aria-label",t('mute_dur'));
      var unit=el("select");
      var opts=[[t('minutes'),1],[t('hours'),60],[t('days'),1440]]; if(!asMod) opts.push([t('forever'),0]);
      opts.forEach(function(o){ var op=el("option",null,o[0]); op.value=String(o[1]); unit.appendChild(op); });
      unit.onchange=function(){ num.disabled=unit.value==="0"; };
      var mb=el("button","sm",t('mute_btn')); mb.type="button";
      mb.onclick=function(){
        var u=parseInt(unit.value,10), n=Math.floor(Number(num.value));
        if(u&&!(n>=1)){ num.focus(); return; }
        n=Math.min(n,9999);
        if(asMod&&(!u||n*u>MAXMIN)){ msg.textContent=t('mod_max_7'); msg.hidden=false; return; }
        fbdb.collection("mutes").doc(key).set({by:me.key,until:u?Date.now()+n*u*60000:0,t:ts()}).then(reopen).catch(fail);
      };
      r1.appendChild(num); r1.appendChild(unit); r1.appendChild(mb);
    }
    p.appendChild(r1); p.appendChild(msg);
    if(!asMod){
      var r3=el("div","row2"), isM2=isMod(key), rm=el("button","sm",isM2?t('remove_mod'):t('make_mod')); rm.type="button";
      rm.onclick=function(){ rm.disabled=true; (isM2?fbdb.collection("roles").doc(key).delete():fbdb.collection("roles").doc(key).set({role:"mod",t:ts()})).then(reopen).catch(fail); };
      r3.appendChild(rm); p.appendChild(r3);
      var r2=el("div","row2"), sure=false, bb=el("button","sm",bn?t('unban'):t('ban')); bb.type="button";
      bb.onclick=function(){

        fbdb.collection("bans").doc(key).set({by:me.key,t:ts()}).then(reopen).catch(fail);
      };
      r2.appendChild(bb); p.appendChild(r2);
    }
    return p;
  }

  function showAdmin(){
    if(fbReady){
      adminToggle(true);
      $("adCount").textContent=t('loading');
      $("adList").innerHTML="";
      Promise.all([fbdb.collection("users").get(),fbdb.collection("accounts").get(),fbdb.collection("roles").get(),fbdb.collection("bans").get()]).then(function(rs){
        var map={}, list=[];
        rs[0].forEach(function(d){ map[d.id]={key:d.id,data:d.data()}; });
        rs[1].forEach(function(d){ if(!map[d.id]) map[d.id]={key:d.id,data:{name:d.data().name}}; });
        Object.keys(map).forEach(function(k){ list.push(map[k]); });
        var rl={}, bn={};
        rs[2].forEach(function(d){ rl[d.id]=d.data(); });
        rs[3].forEach(function(d){ bn[d.id]=d.data(); });
        list.sort(function(a,b){return (a.data.name||"").localeCompare(b.data.name||"")});
        var ul=$("adList"); ul.innerHTML="";
        list.forEach(function(u){
          var li=el("li"), a=el("span","ava s"); paint(a,u.data,u.data.name);
          var nm=u.data.name||u.key, isA=!!rl[u.key]&&rl[u.key].role==="admin", isM=!!rl[u.key]&&rl[u.key].role==="mod", isB=!!bn[u.key];
          var nl=el("span","n",nm);
          if(isA) nl.classList.add("adm");
          if(isM) nl.classList.add("mod");
          if(isB) nl.appendChild(el("span","bdg",t('ban_word')));
          var fail=function(e){ $("adCount").textContent=t('failed_clear')+e.message; };
          var acts=el("div","acts");
          var rb=el("button","sm",isA?t('remove_admin'):t('make_admin')); rb.type="button";
          rb.onclick=function(){ rb.disabled=true; (isA?fbdb.collection("roles").doc(u.key).delete():fbdb.collection("roles").doc(u.key).set({role:"admin",t:firebase.firestore.FieldValue.serverTimestamp()})).then(showAdmin).catch(fail); };
          var mdb=el("button","sm",isM?t('remove_mod'):t('make_mod')); mdb.type="button";
          mdb.onclick=function(){ mdb.disabled=true; (isM?fbdb.collection("roles").doc(u.key).delete():fbdb.collection("roles").doc(u.key).set({role:"mod",t:firebase.firestore.FieldValue.serverTimestamp()})).then(showAdmin).catch(fail); };
          var bb=el("button","sm",isB?t('unban_word'):t('ban_word2')); bb.type="button";
          bb.onclick=function(){ bb.disabled=true; (isB?fbdb.collection("bans").doc(u.key).delete():fbdb.collection("bans").doc(u.key).set({by:"owner",t:firebase.firestore.FieldValue.serverTimestamp()})).then(showAdmin).catch(fail); };
          var b=el("button","sm",pendDel===u.key?t('really_delete'):t('del')); b.type="button";
          b.onclick=function(){
            if(pendDel!==u.key){ pendDel=u.key; showAdmin(); return; }
            pendDel=null; b.disabled=true;
            var lu=users(); delete lu[u.key]; wr(USERS,lu);
            try{ if((localStorage.getItem(SESSION)||"").toLowerCase()===u.key) localStorage.removeItem(SESSION); }catch(e){}
            Promise.all([
              fbdb.collection("deleted").doc(u.key).set({t:firebase.firestore.FieldValue.serverTimestamp()}),
              fbdb.collection("users").doc(u.key).delete(),
              fbdb.collection("accounts").doc(u.key).delete(),
              fbdb.collection("presence").doc(u.key).delete(),
              fbdb.collection("roles").doc(u.key).delete(),
              fbdb.collection("bans").doc(u.key).delete(),
              fbdb.collection("mutes").doc(u.key).delete(),
              fbdb.collection("banners").doc(u.key).delete(),
              fbdb.collection("dms").doc(u.key).delete().catch(function(){})
            ]).then(showAdmin).catch(fail);
          };
          acts.appendChild(rb); acts.appendChild(mdb); acts.appendChild(bb); acts.appendChild(b);
          li.appendChild(a); li.appendChild(nl); li.appendChild(acts); ul.appendChild(li);
        });
        ul.hidden=!list.length;
        $("adCount").textContent = list.length ? (t('total_accounts')+list.length) : t('no_accounts');
      }).catch(function(e){ $("adCount").textContent=t('failed_clear')+e.message; });
      return;
    }
    var all=users(), keys=Object.keys(all).sort(), ul=$("adList"); ul.innerHTML="";
    keys.forEach(function(k){

      var b=el("button","sm",pendDel===k?t('really_delete'):t('del')); b.type="button";
      b.onclick=function(){
        if(pendDel!==k){ pendDel=k; showAdmin(); return; }
        pendDel=null; var u=users(); delete u[k]; wr(USERS,u);
        try{ if((localStorage.getItem(SESSION)||"").toLowerCase()===k) localStorage.removeItem(SESSION); }catch(e){}
        showAdmin();
      };
      li.appendChild(a); li.appendChild(el("span","n",all[k].name)); li.appendChild(b); ul.appendChild(li);
    });
    ul.hidden=!keys.length;
    $("adCount").textContent = keys.length ? (t('total_accounts')+keys.length) : t('no_accounts');
    adminToggle(true);
  }

  $("authForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var name=$("u").value.trim(), pw=$("p").value, err=$("err"); err.textContent="";
    if(!window.crypto||!crypto.subtle){ err.textContent=t('browser_no_crypto'); return; }
    if(mode==="ad"){
      hash(pw,ADSALT).then(function(h){ if(h!==ADHASH){ err.textContent=t('wrong_admin_pass'); return; } $("authForm").reset(); hidePw(); showAdmin(); });
      return;
    }
    if(!/^[A-Za-zА-Яа-яЁё0-9_.-]{3,24}$/.test(name)){ err.textContent=t('name_invalid'); return; }
    if(pw.length<6){ err.textContent=t('pass_short'); return; }
    var all=users(), key=name.toLowerCase();
    if(!fbReady){
      if(mode==="up"){
        if(pw!==$("p2").value){ err.textContent=t('pass_mismatch'); return; }
        if(all[key]){ err.textContent=t('name_taken'); return; }
        var arr0=new Uint8Array(8); crypto.getRandomValues(arr0);
        var salt0=Array.prototype.join.call(arr0,"-");
        hash(pw,salt0).then(function(h){
          all[key]={name:name,salt:salt0,hash:h,avatar:"",bio:""};
          if(!wr(USERS,all)){ err.textContent=t('save_acc_fail'); return; }
          $("authForm").reset(); enter(name);
        });
      }else{
        var acc0=all[key];
        if(!acc0){ err.textContent=t('account_not_found_create'); return; }
        hash(pw,acc0.salt).then(function(h){ if(h!==acc0.hash){ err.textContent=t('wrong_pass'); return; } $("authForm").reset(); enter(acc0.name); });
      }
      return;
    }
    var srvErr=function(e){ console.error("auth:",e); err.textContent=t('no_server'); };
    if(mode==="up"){
      if(pw!==$("p2").value){ err.textContent=t('pass_mismatch'); return; }
      if(all[key]){ err.textContent=t('name_taken_long'); return; }
      var arr=new Uint8Array(8); crypto.getRandomValues(arr);
      var salt=Array.prototype.join.call(arr,"-");
      hash(pw,salt).then(function(h){ return claimAccount(key,name,salt,h); }).then(function(r){
        if(r==="taken"){ err.textContent=t('name_taken_long'); return; }
        fbSaveUser(key,{name:name,avatar:"",bio:""});
        $("authForm").reset(); enter(name);
      }).catch(srvErr);
      return;
    }
    fbdb.collection("accounts").doc(key).get().then(function(d){
      if(d.exists){
        var ac=d.data();
        return hash(pw,ac.salt).then(function(h){ if(h!==ac.hash){ err.textContent=t('wrong_pass'); return; } enterChecked(ac.name||name); });
      }
      var la=all[key];
      if(!la){ err.textContent=t('account_not_found_create'); return; }
      return Promise.all([hash(pw,la.salt),checkDeleted(key)]).then(function(r){
        if(r[1]){ var u=users(); delete u[key]; wr(USERS,u); err.textContent=t('acc_deleted_by'); return; }
        if(r[0]!==la.hash){ err.textContent=t('wrong_pass'); return; }
        return claimAccount(key,la.name,la.salt,la.hash,true).then(function(res){
          if(res==="taken"){ err.textContent=t('wrong_pass'); return; }
          enterChecked(la.name);
        });
      });
    }).catch(srvErr);
  });

  $("langBtnAuth").addEventListener("click",function(){ setLang(lang==='ru'?'en':'ru'); });

  try{
    var s0=localStorage.getItem(SESSION);
    if(s0){
      var sk=s0.toLowerCase(), la0=users()[sk];
      var dropSession=function(){ try{ localStorage.removeItem(SESSION); }catch(e){} };

          enterChecked(la0.name);
        });
      }).catch(function(){ if(la0) enter(la0.name); });
    }
  }catch(e){}
  applyLang();
})();
