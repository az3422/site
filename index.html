<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIVINE.NET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff; --dim:#1c1c1c; color-scheme:dark;
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --text:"Onest","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:1rem;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1,h2{font-family:var(--display);margin:0}

.ava{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--fg);background-color:var(--bg);background-size:cover;background-position:center;display:grid;place-items:center;font-family:var(--display);font-size:1rem;padding:0;overflow:hidden}
.ava.s{width:2rem;height:2rem;font-size:.8rem}
.ava.l{width:6rem;height:6rem;font-size:2.2rem}
button.ava:hover{background-color:var(--dim)}

.btn{background:var(--fg);color:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.6rem 1.3rem;font-weight:500}
.btn:hover{background:var(--bg);color:var(--fg)}
.btn.ghost{background:none;color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.btn.full{width:100%}
.sm{background:none;border:2px solid var(--fg);border-radius:999px;padding:.4rem 1rem;font-size:.9rem;line-height:1.2;min-height:2.3rem;white-space:nowrap;flex:none}
.sm:hover,.sm[aria-pressed=true]{background:var(--fg);color:var(--bg)}

.auth,.modal{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;place-items:center;padding:1.25rem;overflow-y:auto;overflow-x:hidden}
.auth::before{content:"";position:fixed;top:50%;left:50%;width:130vmin;height:130vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 28%,transparent 62%);filter:blur(60px);pointer-events:none;animation:authHalo 5.5s ease-in-out infinite}
@keyframes authHalo{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.modal{background:rgba(0,0,0,.88);z-index:8}
.card{width:100%;max-width:24rem;border:2px solid var(--fg);border-radius:1.1rem;padding:1.75rem;background:var(--bg)}
.auth .card{position:relative;z-index:1;background:rgba(8,8,8,.6);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 60px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.04);animation:cardGlow 4s ease-in-out infinite}
@keyframes cardGlow{0%,100%{box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 50px rgba(255,255,255,.05),0 0 90px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.04)}50%{box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 90px rgba(255,255,255,.13),0 0 160px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.07)}}
.card h1{font-weight:800;font-size:1.8rem;letter-spacing:-.03em;margin-bottom:.4rem}
.card h2{font-weight:800;font-size:1.3rem;margin-bottom:.6rem}
.card p{margin:0 0 1.25rem;opacity:.75}
.card .err{min-height:1.4rem;margin:0 0 .6rem;font-weight:500;opacity:1;transition:color .2s ease}
.card .note{font-size:.85rem;opacity:.7;margin:1rem 0 0}
.tabs{display:flex;border:2px solid var(--fg);border-radius:999px;margin-bottom:1.25rem;overflow:hidden}
.tabs button{flex:1;background:transparent;border:0;padding:.55rem;font-weight:500;transition:background .28s ease,color .28s ease,transform .15s ease}
.tabs button:active{transform:scale(.97)}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg)}
.card label{display:block;font-weight:500;margin-bottom:.9rem;max-height:120px;opacity:1;overflow:clip;overflow-clip-margin:8px;transform:translateY(0);transition:opacity .28s cubic-bezier(.2,.7,.3,1),max-height .35s cubic-bezier(.2,.7,.3,1),margin-bottom .3s cubic-bezier(.2,.7,.3,1),transform .3s cubic-bezier(.2,.7,.3,1)}
.card label.off{max-height:0;opacity:0;margin-bottom:0;transform:translateY(-8px);pointer-events:none}
.card input:not([type=file]),.card textarea{display:block;width:100%;margin-top:.3rem;border:2px solid var(--fg);border-radius:.7rem;padding:.65rem .9rem;background:var(--bg);resize:vertical}
.eye{margin-bottom:.9rem}
#authBtn{transition:opacity .16s ease,transform .18s ease,background .2s ease,color .2s ease}
#adminView{animation:adminIn .32s cubic-bezier(.2,.7,.3,1)}
@keyframes adminIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.adl{margin:0 0 1.25rem;max-height:40vh;overflow-y:auto;border:2px solid var(--fg);border-radius:.7rem}
.adl li{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;border-bottom:1px solid var(--fg)}
.adl li:last-child{border-bottom:0}
.adl li span.n{flex:1;min-width:0;overflow-wrap:anywhere}

.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;margin-bottom:1rem}
.pf p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.glyphs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 1rem}
.g{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--fg);background:none;font-size:1.1rem}
.g:hover,.g[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:.6rem;margin-top:.5rem}
.row .btn{flex:1}

.app{display:grid;grid-template-columns:300px 1fr 240px;height:100%;border:2px solid var(--fg)}
.mem{border-left:2px solid var(--fg);display:flex;flex-direction:column;min-height:0}
.mem h2{font-family:var(--text);font-weight:500;font-size:.95rem;padding:1.1rem 1.1rem .5rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.mlist{flex:1;overflow-y:auto;padding:0 .6rem .8rem}
.mlist button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:0;border-radius:.6rem;padding:.4rem .5rem}
.mlist button:hover{background:var(--dim)}
.mlist .t{display:flex;flex-direction:column;min-width:0}
.mlist .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist small{font-size:.78rem;opacity:.7}
.mlist li.off .nmx{opacity:.6}
.st{position:relative;flex:none;display:block}
.st::after{content:"";position:absolute;right:-3px;bottom:-3px;width:.85rem;height:.85rem;border-radius:50%;background:#808080;border:2px solid var(--bg)}
.st.on::after{background:#23c552}
.memx,.membtn{display:none}
.adm{color:#ff4d4d}
.adm .bdg{color:var(--fg)}
.bdg{display:inline-block;border:2px solid var(--fg);border-radius:999px;padding:0 .45rem;font-size:.7rem;line-height:1.35;margin-left:.4rem;font-weight:500}
.m .b{flex:1}
.delmsg{margin-left:auto;align-self:flex-start;opacity:.5;min-width:2.3rem;padding:.3rem .6rem}
.m:hover .delmsg,.delmsg:focus-visible{opacity:1}
.mlist li{display:flex;align-items:center;gap:.3rem}
.mlist li>button:first-child{flex:1;min-width:0}
.mlist .nline{display:flex;align-items:center;min-width:0}
.mlist .hd{padding:.8rem .5rem .3rem;font-size:.85rem;opacity:.7}
.mlist .bn{flex:1;padding:.4rem .5rem}
.adl li{flex-wrap:wrap}
.acts{flex-basis:100%;display:flex;gap:.4rem;flex-wrap:wrap;padding-left:2.6rem}
.clip{display:grid;place-items:center;padding:.6rem .9rem}
.locked{padding:.95rem 1.25rem;text-align:center;font-weight:500;border-top:2px solid var(--fg)}
.serr{margin:0;padding:.5rem 1.25rem;font-weight:500;border-top:2px solid var(--fg)}
.prev{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.25rem;border-top:2px solid var(--fg)}
.prev img{height:3.5rem;border-radius:.5rem;border:2px solid var(--fg)}
.picb{background:none;border:0;padding:0;display:block;margin-top:.3rem;cursor:zoom-in}
.pic{display:block;max-width:min(100%,360px);max-height:360px;border:2px solid var(--fg);border-radius:.8rem}
.big{display:block;max-width:100%;max-height:75vh;margin:0 auto;border-radius:.6rem}
.card.wide{max-width:min(92vw,60rem);padding:1rem}
.apanel{border:2px solid var(--fg);border-radius:.8rem;padding:.9rem;margin:0 0 1rem;text-align:left}
.apanel h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 .6rem}
.apanel .st2{margin:0 0 .5rem;opacity:1;font-weight:500}
.row2{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}
select,.apanel input[type=number]{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.35rem .9rem;min-height:2.3rem;line-height:1.2}
.apanel input[type=number]{width:5.5rem}
.apanel input,.apanel select,.apanel button{flex:none}
.side{border-right:2px solid var(--fg);display:flex;flex-direction:column;min-height:0}
.side h1{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding:1.1rem 1.25rem;border-bottom:2px solid var(--fg)}
.cat{padding:.9rem 1.25rem .3rem;font-size:.85rem;font-weight:500;opacity:.7}
.list{flex:1;overflow-y:auto;padding:0 .6rem}
.list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:.6rem;padding:.6rem .7rem;font-weight:500}
.list button:hover{background:var(--dim)}
.list li.on button{background:var(--fg);color:var(--bg)}
.me{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-top:2px solid var(--fg)}
.mebtn{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;background:none;border:0;padding:.2rem;text-align:left;border-radius:.6rem}
.mebtn:hover{background:var(--dim)}
#who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.25rem;border-bottom:2px solid var(--fg)}
.top b{font-family:var(--display);font-weight:500}
.top small{opacity:.7}
.back{display:none;background:none;border:2px solid var(--fg);border-radius:50%;width:2.4rem;height:2.4rem;padding:0;place-items:center}
.msgs{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.m{display:flex;gap:.8rem;padding:.4rem 0}
.m .b{min-width:0}
.m .h{display:flex;align-items:baseline;gap:.5rem}
.m .nm{background:none;border:0;padding:0;font-weight:500}
.m .nm:hover{text-decoration:underline}
.m time{font-size:.78rem;opacity:.6}
.m p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.empty{margin:2rem auto;text-align:center;opacity:.7}
.fcard{border:2px solid var(--fg);border-radius:1rem;padding:.9rem 1rem;margin:0 0 .8rem;display:flex;flex-direction:column;gap:.5rem;transition:background .15s,transform .15s}
.fcard:hover{background:var(--dim)}
.fcard .fh{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.fcard time{font-size:.78rem;opacity:.6}
.fcard .fp{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fcard .pic{max-width:min(100%,400px);max-height:300px;border:0;margin-top:.2rem;border-radius:.6rem}
.fcard .actions{display:flex;justify-content:flex-end;margin-top:.3rem}
.fcard .delmsg{opacity:.5;margin:0;align-self:auto}
.fcard:hover .delmsg,.fcard .delmsg:focus-visible{opacity:1}
.sendbar{display:flex;gap:.6rem;padding:.8rem 1.25rem;border-top:2px solid var(--fg)}
#input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.65rem 1.1rem}

@media (max-width:1000px){
  .app{grid-template-columns:300px 1fr}
  .mem{display:none}
  .app.showmem .mem{display:flex;position:fixed;inset:0;z-index:6;background:var(--bg);border-left:0}
  .memx{display:inline-block}
  .membtn{display:inline-block;margin-left:auto}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr;border:0}
  .side{border-right:0}
  .chat{display:none}
  .app.open .side{display:none}
  .app.open .chat{display:flex}
  .back{display:grid}
}
</style>
</head>
<body>
<div class="auth" id="auth">
  <div class="card">
    <h1>DIVINE.NET</h1>
    <p id="intro">Войдите или создайте аккаунт.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabIn" aria-selected="true">Вход</button>
      <button type="button" role="tab" id="tabUp" aria-selected="false">Регистрация</button>
      <button type="button" role="tab" id="tabAd" aria-selected="false">admin</button>
    </div>
    <form id="authForm">
      <label>Имя пользователя<input type="text" id="u" autocomplete="username" maxlength="24" required></label>
      <label>Пароль<input type="password" id="p" autocomplete="current-password" maxlength="100" required></label>
      <label id="p2row" hidden>Повторите пароль<input type="password" id="p2" autocomplete="new-password" maxlength="100"></label>
      <button type="button" class="sm eye" id="eye" aria-pressed="false">Показать пароль</button>
      <p class="err" id="err" role="alert"></p>
      <button class="btn full" type="submit" id="authBtn">Войти</button>
    </form>
    <div id="adminView" hidden>
      <h2>Аккаунты</h2>
      <p id="adCount"></p>
      <ul class="adl" id="adList"></ul>
      <button class="btn full" type="button" id="adOut">Закрыть</button>
    </div>
    <p class="note">Наслаждайтесь скриптами.</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <h1>DIVINE.NET</h1>
    <div class="cat">Текстовые каналы</div>
    <ul class="list" id="list"></ul>
    <div class="me">
      <button class="mebtn" id="meBtn" type="button" aria-label="Открыть мой профиль"><span class="ava s" id="meAva"></span><span id="who"></span></button>
      <button class="sm" id="out" type="button">Выйти</button>
    </div>
  </aside>
  <section class="chat" aria-label="Канал">
    <div class="top">
      <button class="back" id="back" type="button" aria-label="Назад к списку каналов">←</button>
      <b id="topName"></b><small id="topSub"></small>
      <button class="sm membtn" id="memBtn" type="button">Участники</button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <p class="serr" id="serr" role="alert" hidden></p>
    <div class="prev" id="prev" hidden><img id="prevImg" alt="Выбранное фото"><button type="button" class="sm" id="prevX">Убрать</button></div>
    <div class="locked" id="locked" hidden>Следите за новостями</div>
    <form class="sendbar" id="form" autocomplete="off">
      <input type="text" id="input" aria-label="Сообщение" maxlength="2000">
      <input type="file" id="file" accept="image/*" hidden>
      <button class="btn ghost clip" type="button" id="clip" aria-label="Прикрепить фото" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
      <button class="btn" type="submit">Отправить</button>
    </form>
  </section>
  <aside class="mem" aria-label="Участники">
    <h2><span id="memTitle">Участники</span><button class="sm memx" id="memX" type="button">Закрыть</button></h2>
    <ul class="mlist" id="mlist"></ul>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="card" id="pcard"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var USERS="divine-net-users-v1", SESSION="divine-net-session-v1", SRV="divine-net-server-v1";
  var ADSALT="divine-admin", ADHASH="cd0159aca7bbdb576d4beec4912e52a6bbd97f1205510b3c2a03e829b1c75208";
  var CH=[{id:"announcements",name:"announcements",sub:"Новости сервера"},{id:"scripts",name:"scripts",sub:"Форум скриптов"},{id:"general",name:"general",sub:"Общий чат"},{id:"media",name:"media",sub:"Фотографии"}];
  var READONLY={"announcements":1,"scripts":1};
  var GLYPHS=["◐","◑","▲","●","■","✦","☾","☻"];
  var FORUM_SVG='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align:middle;margin-right:.4rem" aria-hidden="true"><path d="M3 4h18v2H3V4zm0 5h18v2H3V9zm0 5h18v2H3v-2z"/></svg>';
  var me=null,cur=CH[0].id,data={},mode="in",pendDel=null,draft=null,app=$("app"),btnToken=0;

  var firebaseConfig = {
    apiKey:            "AIzaSyDOHK7PjvtA7Z5g4EiOnZGIMthm-HCd7LQ",
    authDomain:        "divine-net.firebaseapp.com",
    projectId:         "divine-net",
    storageBucket:     "divine-net.firebasestorage.app",
    messagingSenderId: "477692936922",
    appId:             "1:477692936922:web:fdd8daab2a89c588f91be3"
  };
  var fbReady=false, fbdb=null;
  var unsubMsgs=null, unsubUsers=null, unsubPres=null, unsubDel=null, hbTimer=null, tickTimer=null, presence={}, PRES_TTL=90000, roles={}, bans={}, unsubRoles=null, unsubBans=null, pendMsg=null, pendBan=null, pendImg=null, mutes={}, unsubMutes=null;
  var remoteUsers={};
  try{
    if(typeof firebase!=="undefined" && firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("ВСТАВЬ")===-1){
      firebase.initializeApp(firebaseConfig);
      fbdb=firebase.firestore();
      fbReady=true;
    }
  }catch(e){ console.error("Firebase:",e); fbReady=false; }

  function subscribeMessages(channelId){
    if(!fbReady) return;
    if(unsubMsgs){ unsubMsgs(); unsubMsgs=null; }
    unsubMsgs = fbdb.collection("channels").doc(channelId).collection("messages")
      .orderBy("createdAt","desc").limit(channelId==="media"?20:200)
      .onSnapshot(function(snap){
        var arr=[];
        snap.forEach(function(d){
          var x=d.data();
          arr.push({
            id: d.id,
            by: x.by,
            name: x.name,
            text: x.text,
            image: x.image||"",
            t: x.createdAt ? x.createdAt.toDate().getTime() : Date.now()
          });
        });
        arr.reverse();
        data[channelId]=arr;
        if(cur===channelId) renderMsgs();
      }, function(e){ console.error("messages:",e); });
  }

  function subscribeUsers(){
    if(!fbReady) return;
    if(unsubUsers){ unsubUsers(); unsubUsers=null; }
    fbdb.collection("users").get().then(function(snap){
      var tmp={};
      snap.forEach(function(d){ tmp[d.id]=d.data(); });
      remoteUsers=tmp;
      if(me){ renderMe(); renderMembers(); }
      renderMsgs();
    }).catch(function(e){ console.error("users.get:",e); });
    unsubUsers = fbdb.collection("users").onSnapshot(function(snap){
      var tmp={};
      snap.forEach(function(d){ tmp[d.id]=d.data(); });
      remoteUsers=tmp;
      if(me){ renderMe(); renderMembers(); }
      renderMsgs();
    }, function(e){ console.error("users:",e); });
  }

  function isOnline(key){
    if(me&&key===me.key) return true;
    var t=presence[key]; return !!t&&Date.now()-t<PRES_TTL;
  }
  function memberList(){
    var src=fbReady?remoteUsers:users(), out=[];
    Object.keys(src).forEach(function(k){ out.push({key:k,acc:src[k]}); });
    if(me&&!src[me.key]) out.push({key:me.key,acc:getAcc(me.key)||{name:me.name}});
    return out;
  }
  function isAdmin(key){ var r=roles[key]; return !!r&&r.role==="admin"; }
  function amAdmin(){ return !!me&&isAdmin(me.key); }
  function renderMembers(){
    if(!me) return;
    var ul=$("mlist"), adm=fbReady&&amAdmin();
    var list=memberList().filter(function(m){ return !bans[m.key]; }).map(function(m){
      m.on=isOnline(m.key); m.name=(m.acc&&m.acc.name)||m.key; return m;
    });
    list.sort(function(a,b){ return (b.on-a.on)||a.name.localeCompare(b.name); });
    var n=list.filter(function(m){return m.on}).length;
    $("memTitle").textContent="В сети: "+n+" из "+list.length;
    ul.innerHTML="";
    function row(m){
      var li=el("li",m.on?"on":"off"), b=el("button"); b.type="button";

    var acc=getAcc(key), mine=!!(me&&key===me.key&&acc), box=$("pcard");
    box.innerHTML=""; $("modal").hidden=false;
    var pf=el("div","pf"), av=el("div","ava l"), nm=el("h2",null,acc?acc.name:name);
    pf.appendChild(av); pf.appendChild(nm);
    if(!mine){
      paint(av,acc,name);
      pf.appendChild(el("p",null,acc?(acc.bio||"Описание не указано."):"Аккаунт удалён."));
      box.appendChild(pf);
      if(acc&&fbReady&&amAdmin()&&me&&key!==me.key&&!isAdmin(key)) box.appendChild(adminPanel(key,name));
      var c1=el("button","btn ghost full","Закрыть"); c1.type="button"; c1.onclick=closeProfile; box.appendChild(c1);
      c1.focus(); return;
    }
    draft={avatar:acc.avatar||""};
    nm.textContent="Мой профиль"; box.appendChild(pf);
    var gb=[];
    function sync(){ paint(av,draft,acc.name); gb.forEach(function(b){ b.setAttribute("aria-pressed",String(b.textContent===draft.avatar)); }); }
    var file=el("input"); file.type="file"; file.accept="image/*"; file.hidden=true;
    var up=el("button","btn ghost full","Загрузить фото"); up.type="button"; up.onclick=function(){ file.click(); };
    var err=el("p","err"); err.setAttribute("role","alert");
    file.onchange=function(){
      var f=file.files[0]; if(!f) return; err.textContent="";
      resize(f,function(d){ if(!d){ err.textContent="Не удалось открыть изображение."; return; } draft.avatar=d; sync(); });
    };
    box.appendChild(file); box.appendChild(up);
    box.appendChild(el("p",null,"Или выберите значок:")).style.margin=".8rem 0 0";
    var gl=el("div","glyphs");
    GLYPHS.forEach(function(g){ var b=el("button","g",g); b.type="button"; b.setAttribute("aria-label","Значок "+g); b.onclick=function(){ draft.avatar=g; sync(); }; gb.push(b); gl.appendChild(b); });
    box.appendChild(gl);
    var reset=el("button","sm","Сбросить аватарку"); reset.type="button"; reset.onclick=function(){ draft.avatar=""; sync(); };
    box.appendChild(reset);
    var lab=el("label",null,"Описание"); lab.style.marginTop="1rem";
    var ta=el("textarea"); ta.rows=3; ta.maxLength=200; ta.value=acc.bio||""; lab.appendChild(ta);
    box.appendChild(lab); box.appendChild(err);
    var row=el("div","row"), save=el("button","btn","Сохранить"), cancel=el("button","btn ghost","Отмена");
    save.type="button"; cancel.type="button"; cancel.onclick=closeProfile;
    save.onclick=function(){
      var u=users(), bio=ta.value.trim().slice(0,200);
      if(u[me.key]){ u[me.key].avatar=draft.avatar; u[me.key].bio=bio; if(!wr(USERS,u)){ err.textContent="Не удалось сохранить: слишком большое фото."; return; } }
      fbSaveUser(me.key, { name: me.name, avatar: draft.avatar, bio: bio });
      closeProfile(); render();
    };
    row.appendChild(save); row.appendChild(cancel); box.appendChild(row);
    sync();
  }

  function hidePw(){
    $("eye").setAttribute("aria-pressed","false"); $("eye").textContent="Показать пароль";
    $("p").type="password"; $("p2").type="password";
  }
  $("eye").addEventListener("click",function(){
    var show=$("eye").getAttribute("aria-pressed")!=="true";
    $("eye").setAttribute("aria-pressed",String(show));
    $("eye").textContent=show?"Скрыть пароль":"Показать пароль";
    $("p").type=show?"text":"password"; $("p2").type=show?"text":"password";
  });
  function setMode(m){
    mode=m;
    $("tabIn").setAttribute("aria-selected",m==="in");
    $("tabUp").setAttribute("aria-selected",m==="up");
    $("tabAd").setAttribute("aria-selected",m==="ad");
    var uLab=$("u").parentNode;
    if(uLab.hasAttribute("hidden")) uLab.removeAttribute("hidden");
    uLab.classList.toggle("off", m==="ad");
    $("u").required=m!=="ad";
    var p2row=$("p2row");
    if(p2row.hasAttribute("hidden")) p2row.removeAttribute("hidden");
    p2row.classList.toggle("off", m!=="up");
    $("p2").required=m==="up";
    $("p").autocomplete=m==="up"?"new-password":"current-password";
    var btnText=m==="up"?"Создать аккаунт":m==="ad"?"Открыть":"Войти";
    var btn=$("authBtn");
    if(btn.textContent.trim()!==btnText){
      var tk=++btnToken;
      btn.style.opacity="0";
      btn.style.transform="scale(.96)";
      setTimeout(function(){
        if(tk!==btnToken) return;
        btn.textContent=btnText;
        btn.style.opacity="";
        btn.style.transform="";
      },150);
    }
    $("err").textContent="";
  }
  $("tabIn").addEventListener("click",function(){ setMode("in"); });
  $("tabUp").addEventListener("click",function(){ setMode("up"); });
  $("tabAd").addEventListener("click",function(){ setMode("ad"); });

  function adminToggle(on){
    [".tabs","#authForm",".note","#intro"].forEach(function(s){ document.querySelector(s).hidden=on; });
    $("adminView").hidden=!on;
  }
  function showAdmin(){
    if(fbReady){
      adminToggle(true);
      $("adCount").textContent="Загрузка…";
      $("adList").innerHTML="";
      Promise.all([fbdb.collection("users").get(),fbdb.collection("accounts").get(),fbdb.collection("roles").get(),fbdb.collection("bans").get()]).then(function(rs){
        var map={}, list=[];
        rs[0].forEach(function(d){ map[d.id]={key:d.id,data:d.data()}; });
        rs[1].forEach(function(d){ if(!map[d.id]) map[d.id]={key:d.id,data:{name:d.data().name}}; });
        Object.keys(map).forEach(function(k){ list.push(map[k]); });
        var rl={}, bn={};
        rs[2].forEach(function(d){ rl[d.id]=d.data(); });
        rs[3].forEach(function(d){ bn[d.id]=d.data(); });
        list.sort(function(a,b){return (a.data.name||"").localeCompare(b.data.name||"")});
        var ul=$("adList"); ul.innerHTML="";
        list.forEach(function(u){
          var li=el("li"), a=el("span","ava s"); paint(a,u.data,u.data.name);
          var nm=u.data.name||u.key, isA=!!rl[u.key]&&rl[u.key].role==="admin", isB=!!bn[u.key];
          var nl=el("span","n",nm);
          if(isA) nl.classList.add("adm");
          if(isB) nl.appendChild(el("span","bdg","бан"));
          var fail=function(e){ $("adCount").textContent="Не удалось: "+e.message; };
          var acts=el("div","acts");
          var rb=el("button","sm",isA?"Снять админку":"Дать админку"); rb.type="button";
          rb.onclick=function(){
            rb.disabled=true;
            (isA?fbdb.collection("roles").doc(u.key).delete():fbdb.collection("roles").doc(u.key).set({role:"admin",t:firebase.firestore.FieldValue.serverTimestamp()})).then(showAdmin).catch(fail);
          };
          var bb=el("button","sm",isB?"Разбан":"Бан"); bb.type="button";
          bb.onclick=function(){
            bb.disabled=true;
            (isB?fbdb.collection("bans").doc(u.key).delete():fbdb.collection("bans").doc(u.key).set({by:"owner",t:firebase.firestore.FieldValue.serverTimestamp()})).then(showAdmin).catch(fail);
          };
          var b=el("button","sm",pendDel===u.key?"Точно удалить?":"Удалить"); b.type="button";
          b.setAttribute("aria-label","Удалить аккаунт "+nm);
          b.onclick=function(){
            if(pendDel!==u.key){ pendDel=u.key; showAdmin(); return; }
            pendDel=null; b.disabled=true;
            var lu=users(); delete lu[u.key]; wr(USERS,lu);
            try{ if((localStorage.getItem(SESSION)||"").toLowerCase()===u.key) localStorage.removeItem(SESSION); }catch(e){}
            Promise.all([
              fbdb.collection("deleted").doc(u.key).set({t:firebase.firestore.FieldValue.serverTimestamp()}),
              fbdb.collection("users").doc(u.key).delete(),
              fbdb.collection("accounts").doc(u.key).delete(),
              fbdb.collection("presence").doc(u.key).delete(),
              fbdb.collection("roles").doc(u.key).delete(),
              fbdb.collection("bans").doc(u.key).delete(),
              fbdb.collection("mutes").doc(u.key).delete()
            ]).then(showAdmin).catch(fail);
          };
          acts.appendChild(rb); acts.appendChild(bb); acts.appendChild(b);
          li.appendChild(a); li.appendChild(nl); li.appendChild(acts); ul.appendChild(li);
        });
        ul.hidden=!list.length;
        $("adCount").textContent=list.length?"Всего аккаунтов: "+list.length:"Аккаунтов пока нет.";
      }).catch(function(e){
        $("adCount").textContent="Ошибка загрузки: "+e.message;
      });
      return;
    }
    var all=users(), keys=Object.keys(all).sort(), ul=$("adList"); ul.innerHTML="";
    keys.forEach(function(k){
      var li=el("li"), a=el("span","ava s"); paint(a,all[k],all[k].name);
      var b=el("button","sm",pendDel===k?"Точно удалить?":"Удалить"); b.type="button";
      b.setAttribute("aria-label","Удалить аккаунт "+all[k].name);
      b.onclick=function(){
        if(pendDel!==k){ pendDel=k; showAdmin(); return; }
        pendDel=null; var u=users(); delete u[k]; wr(USERS,u);
        try{ if((localStorage.getItem(SESSION)||"").toLowerCase()===k) localStorage.removeItem(SESSION); }catch(e){}
        showAdmin();
      };
      li.appendChild(a); li.appendChild(el("span","n",all[k].name)); li.appendChild(b); ul.appendChild(li);
    });
    ul.hidden=!keys.length;
    $("adCount").textContent=keys.length?"Всего аккаунтов: "+keys.length:"Аккаунтов пока нет.";
    adminToggle(true);
  }
  $("adOut").addEventListener("click",function(){ pendDel=null; adminToggle(false); setMode("in"); });

  $("authForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var name=$("u").value.trim(), pw=$("p").value, err=$("err"); err.textContent="";
    if(!window.crypto||!crypto.subtle){ err.textContent="Браузер не поддерживает безопасный вход."; return; }
    if(mode==="ad"){
      hash(pw,ADSALT).then(function(h){
        if(h!==ADHASH){ err.textContent="Неверный пароль администратора."; return; }
        $("authForm").reset(); hidePw(); showAdmin();
      });
      return;
    }
    if(!/^[A-Za-zА-Яа-яЁё0-9_.-]{3,24}$/.test(name)){ err.textContent="Имя: 3–24 символа, буквы, цифры, _ . -"; return; }
    if(pw.length<6){ err.textContent="Пароль должен быть не короче 6 символов."; return; }
    var all=users(), key=name.toLowerCase();
    if(!fbReady){
      if(mode==="up"){
        if(pw!==$("p2").value){ err.textContent="Пароли не совпадают."; return; }
        if(all[key]){ err.textContent="Такое имя уже занято."; return; }
        var arr0=new Uint8Array(8); crypto.getRandomValues(arr0);
        var salt0=Array.prototype.join.call(arr0,"-");
        hash(pw,salt0).then(function(h){
          all[key]={name:name,salt:salt0,hash:h,avatar:"",bio:""};
          if(!wr(USERS,all)){ err.textContent="Не удалось сохранить аккаунт."; return; }
          $("authForm").reset(); enter(name);
        });
      }else{
        var acc0=all[key];
        if(!acc0){ err.textContent="Аккаунт не найден. Создайте его на вкладке «Регистрация»."; return; }
        hash(pw,acc0.salt).then(function(h){
          if(h!==acc0.hash){ err.textContent="Неверный пароль."; return; }
          $("authForm").reset(); enter(acc0.name);
        });
      }
      return;
    }
    var TAKEN="Такое имя уже занято (регистр букв не важен). Если это ваш аккаунт, откройте вкладку «Вход».";
    var srvErr=function(e){ console.error("auth:",e); err.textContent="Не удалось связаться с сервером. Попробуйте позже."; };
    if(mode==="up"){
      if(pw!==$("p2").value){ err.textContent="Пароли не совпадают."; return; }
      if(all[key]){ err.textContent=TAKEN; return; }
      var arr=new Uint8Array(8); crypto.getRandomValues(arr);
      var salt=Array.prototype.join.call(arr,"-");
      hash(pw,salt).then(function(h){ return claimAccount(key,name,salt,h); }).then(function(r){
        if(r==="taken"){ err.textContent=TAKEN; return; }
        fbSaveUser(key,{name:name});
        return fbdb.collection("deleted").doc(key).delete().catch(function(){}).then(function(){ $("authForm").reset(); enter(name); });
      }).catch(srvErr);
      return;
    }
    fbdb.collection("accounts").doc(key).get().then(function(d){
      if(d.exists){
        var ac=d.data();
        return hash(pw,ac.salt).then(function(h){
          if(h!==ac.hash){ err.textContent="Неверный пароль."; return; }
          enterChecked(ac.name||name);
        });
      }
      var la=all[key];
      if(!la){ err.textContent="Аккаунт не найден. Создайте его на вкладке «Регистрация»."; return; }
      return Promise.all([hash(pw,la.salt),checkDeleted(key)]).then(function(r){
        if(r[1]){ var u=users(); delete u[key]; wr(USERS,u); err.textContent="Этот аккаунт удалён администратором."; return; }
        if(r[0]!==la.hash){ err.textContent="Неверный пароль."; return; }
        return claimAccount(key,la.name,la.salt,la.hash,true).then(function(res){
          if(res==="taken"){ err.textContent="Неверный пароль."; return; }
          fbSaveUser(key,{name:la.name});
          enterChecked(la.name);
        });
      });
    }).catch(srvErr);
  });

  try{
    var s0=localStorage.getItem(SESSION);
    if(s0){
      var sk=s0.toLowerCase(), la0=users()[sk];
      var dropSession=function(){ try{ localStorage.removeItem(SESSION); }catch(e){} };
      if(!fbReady){ if(la0) enter(la0.name); }
      else fbdb.collection("accounts").doc(sk).get().then(function(d){
        if(d.exists){ enterChecked(d.data().name||s0); return; }
        if(!la0){ dropSession(); return; }
        return checkDeleted(sk).then(function(del){
          if(del){ var u=users(); delete u[sk]; wr(USERS,u); dropSession(); return; }
          return claimAccount(sk,la0.name,la0.salt,la0.hash,true).then(function(res){
            if(res==="taken"){ dropSession(); return; }
            fbSaveUser(sk,{name:la0.name});
            enterChecked(la0.name);
          });
        });
      }).catch(function(){ if(la0) enter(la0.name); });
    }
  }catch(e){}
})();
</script>
</body>
</html>
