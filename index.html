<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIVINE.NET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff; --dim:#1c1c1c; color-scheme:dark;
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --text:"Onest","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:1rem;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1,h2{font-family:var(--display);margin:0}
.ava{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--fg);background-color:var(--bg);background-size:cover;background-position:center;display:grid;place-items:center;font-family:var(--display);font-size:1rem;padding:0;overflow:hidden}
.ava.s{width:2rem;height:2rem;font-size:.8rem}
.ava.l{width:6rem;height:6rem;font-size:2.2rem}
button.ava:hover{background-color:var(--dim)}
.btn{background:var(--fg);color:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.6rem 1.3rem;font-weight:500}
.btn:hover{background:var(--bg);color:var(--fg)}
.btn.ghost{background:none;color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:var(--bg)}
.btn.full{width:100%}
.sm{background:none;border:2px solid var(--fg);border-radius:999px;padding:.15rem .8rem;font-size:.85rem}
.sm:hover,.sm[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.auth,.modal{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;place-items:center;padding:1.25rem;overflow-y:auto}
.modal{background:rgba(0,0,0,.88);z-index:8}
.card{width:100%;max-width:24rem;border:2px solid var(--fg);border-radius:1.1rem;padding:1.75rem;background:var(--bg)}
.card h1{font-weight:800;font-size:1.8rem;letter-spacing:-.03em;margin-bottom:.4rem}
.card h2{font-weight:800;font-size:1.3rem;margin-bottom:.6rem}
.card p{margin:0 0 1.25rem;opacity:.75}
.card .err{min-height:1.4rem;margin:0 0 .6rem;font-weight:500;opacity:1}
.card .note{font-size:.85rem;opacity:.7;margin:1rem 0 0}
.tabs{display:flex;border:2px solid var(--fg);border-radius:999px;margin-bottom:1.25rem;overflow:hidden}
.tabs button{flex:1;background:none;border:0;padding:.55rem;font-weight:500}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg)}
.card label{display:block;font-weight:500;margin-bottom:.9rem}
.card input:not([type=file]),.card textarea{display:block;width:100%;margin-top:.3rem;border:2px solid var(--fg);border-radius:.7rem;padding:.65rem .9rem;background:var(--bg);resize:vertical}
.eye{margin-bottom:.9rem}
.adl{margin:0 0 1.25rem;max-height:40vh;overflow-y:auto;border:2px solid var(--fg);border-radius:.7rem}
.adl li{display:flex;align-items:center;gap:.6rem;padding:.5rem .9rem;border-bottom:1px solid var(--fg)}
.adl li:last-child{border-bottom:0}
.adl li span.n{flex:1;min-width:0;overflow-wrap:anywhere}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;margin-bottom:1rem}
.pf p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.glyphs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 1rem}
.g{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--fg);background:none;font-size:1.1rem}
.g:hover,.g[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:.6rem;margin-top:.5rem}
.row .btn{flex:1}
.app{display:grid;grid-template-columns:300px 1fr;height:100%;border:2px solid var(--fg)}
.side{border-right:2px solid var(--fg);display:flex;flex-direction:column;min-height:0}
.side h1{font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding:1.1rem 1.25rem;border-bottom:2px solid var(--fg)}
.cat{padding:.9rem 1.25rem .3rem;font-size:.85rem;font-weight:500;opacity:.7}
.list{flex:1;overflow-y:auto;padding:0 .6rem}
.list button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:.6rem;padding:.6rem .7rem;font-weight:500}
.list button:hover{background:var(--dim)}
.list li.on button{background:var(--fg);color:var(--bg)}
.me{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-top:2px solid var(--fg)}
.mebtn{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;background:none;border:0;padding:.2rem;text-align:left;border-radius:.6rem}
.mebtn:hover{background:var(--dim)}
#who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.25rem;border-bottom:2px solid var(--fg)}
.top b{font-family:var(--display);font-weight:500}
.top small{opacity:.7}
.back{display:none;background:none;border:2px solid var(--fg);border-radius:50%;width:2.4rem;height:2.4rem;padding:0;place-items:center}
.msgs{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.m{display:flex;gap:.8rem;padding:.4rem 0}
.m .b{min-width:0}
.m .h{display:flex;align-items:baseline;gap:.5rem}
.m .nm{background:none;border:0;padding:0;font-weight:500}
.m .nm:hover{text-decoration:underline}
.m time{font-size:.78rem;opacity:.6}
.m p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.empty{margin:2rem auto;text-align:center;opacity:.7}
.sendbar{display:flex;gap:.6rem;padding:.8rem 1.25rem;border-top:2px solid var(--fg)}
#input{flex:1;min-width:0;background:var(--bg);border:2px solid var(--fg);border-radius:999px;padding:.65rem 1.1rem}
@media (max-width:720px){
  .app{grid-template-columns:1fr;border:0}
  .side{border-right:0}
  .chat{display:none}
  .app.open .side{display:none}
  .app.open .chat{display:flex}
  .back{display:grid}
}
</style>
</head>
<body>
<div class="auth" id="auth">
  <div class="card">
    <h1>DIVINE.NET</h1>
    <p id="intro">Войдите или создайте аккаунт.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabIn" aria-selected="true">Вход</button>
      <button type="button" role="tab" id="tabUp" aria-selected="false">Регистрация</button>
      <button type="button" role="tab" id="tabAd" aria-selected="false">admin</button>
    </div>
    <form id="authForm">
      <label>Имя пользователя<input type="text" id="u" autocomplete="username" maxlength="24" required></label>
      <label>Пароль<input type="password" id="p" autocomplete="current-password" maxlength="100" required></label>
      <label id="p2row" hidden>Повторите пароль<input type="password" id="p2" autocomplete="new-password" maxlength="100"></label>
      <button type="button" class="sm eye" id="eye" aria-pressed="false">Показать пароль</button>
      <p class="err" id="err" role="alert"></p>
      <button class="btn full" type="submit" id="authBtn">Войти</button>
    </form>
    <div id="adminView" hidden>
      <h2>Аккаунты</h2>
      <p id="adCount"></p>
      <ul class="adl" id="adList"></ul>
      <button class="btn full" type="button" id="adOut">Закрыть</button>
    </div>
    <p class="note">Аккаунты и сообщения хранятся в Firebase. Доступны с любого устройства.</p>
  </div>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <h1>DIVINE.NET</h1>
    <div class="cat">Текстовые каналы</div>
    <ul class="list" id="list"></ul>
    <div class="me">
      <button class="mebtn" id="meBtn" type="button" aria-label="Открыть мой профиль"><span class="ava s" id="meAva"></span><span id="who"></span></button>
      <button class="sm" id="out" type="button">Выйти</button>
    </div>
  </aside>
  <section class="chat" aria-label="Канал">
    <div class="top">
      <button class="back" id="back" type="button" aria-label="Назад к списку каналов">←</button>
      <b id="topName"></b><small id="topSub"></small>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="sendbar" id="form" autocomplete="off">
      <input type="text" id="input" aria-label="Сообщение" maxlength="2000">
      <button class="btn" type="submit">Отправить</button>
    </form>
  </section>
</div>
<div class="modal" id="modal" hidden><div class="card" id="pcard"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
         signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc,
         query, orderBy, onSnapshot, serverTimestamp, limit }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


   ============================================================ */
const firebaseConfig = {

  apiKey: "AIzaSyDOHK7PjvtA7Z5g4EiOnZGIMthm-HCd7LQ",

  authDomain: "divine-net.firebaseapp.com",

  projectId: "divine-net",

  storageBucket: "divine-net.firebasestorage.app",

  messagingSenderId: "477692936922",

  appId: "1:477692936922:web:fdd8daab2a89c588f91be3",

  measurementId: "G-6M33RTRHML"

};

/* ============================================================ */

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getFirestore(fbApp);

const $  = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

const CH = [
  { id: "announcements", name: "announcements", sub: "Новости сервера" },
  { id: "general",       name: "general",       sub: "Общий чат" }
];
const GLYPHS = ["◐","◑","▲","●","■","✦","☾","☻"];
const ADSALT = "divine-admin";
const ADHASH = "cd0159aca7bbdb576d4beec4912e52a6bbd97f1205510b3c2a03e829b1c75208";
const EMAIL_DOMAIN = "divine-net.app";

let me = null;
let usersMap = new Map();
let cur = CH[0].id;
let mode = "in";
let draft = null;
let unsubMsgs = null;
let unsubUsers = null;
let lastMessages = [];
const appEl = $("app");

function okImg(a){ return typeof a === "string" && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(a); }
function paint(node, acc, name){
  const a = acc && acc.avatar;
  node.textContent = ""; node.style.backgroundImage = "";
  if (okImg(a)) node.style.backgroundImage = "url(" + a + ")";
  else if (GLYPHS.indexOf(a) > -1) node.textContent = a;
  else node.textContent = (name || "?").charAt(0).toUpperCase();
}
async function sha256hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(x => ("0" + x.toString(16)).slice(-2)).join("");
}
async function nameToEmail(name){
  const hex = await sha256hex(name.toLowerCase().trim());
  return hex + "@" + EMAIL_DOMAIN;
}
async function loadProfileWithRetry(uid){
  for (let i = 0; i < 10; i++){
    try {
      const snap = await getDoc(doc(db, "users", uid));
      if (snap.exists()) return snap.data();
    } catch(e){ console.error(e); }
    await new Promise(r => setTimeout(r, 200));
  }
  return null;
}

onAuthStateChanged(auth, async (user) => {
  if (!user){ exitApp(); return; }
  if (me && me.uid === user.uid) return;
  const data = await loadProfileWithRetry(user.uid);
  if (data){
    me = { uid: user.uid, name: data.name, avatar: data.avatar || "", bio: data.bio || "" };
    enterApp();
  } else {
    try { await signOut(auth); } catch(e){}
    $("err").textContent = "Профиль не найден. Зарегистрируйтесь заново или смените имя.";
  }
});

function enterApp(){
  $("auth").hidden = true;
  appEl.hidden = false;
  appEl.classList.remove("open");
  hidePw();
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
    usersMap.clear();
    snap.forEach(d => usersMap.set(d.id, d.data()));
    renderMe();
    renderMsgs();
  }, (err) => console.error("users snapshot:", err));
  subscribeMessages();
  renderList();
}
function exitApp(){
  if (unsubUsers) { unsubUsers(); unsubUsers = null; }
  if (unsubMsgs)  { unsubMsgs();  unsubMsgs  = null; }
  usersMap.clear();
  lastMessages = [];
  me = null;
  closeProfile();
  appEl.hidden = true;
  $("auth").hidden = false;
  hidePw();
  setMode("in");
  $("u").focus();
}

function chan(){ return CH.filter(c => c.id === cur)[0]; }
function renderList(){
  const ul = $("list"); ul.innerHTML = "";
  CH.forEach(c => {
    const li = el("li", c.id === cur ? "on" : "");
    const b  = el("button", null, "# " + c.name); b.type = "button";
    b.onclick = () => {
      cur = c.id; lastMessages = []; appEl.classList.add("open");
      renderList(); subscribeMessages();
      if (window.matchMedia("(min-width:721px)").matches) $("input").focus();
    };
    li.appendChild(b); ul.appendChild(li);
  });
}
function renderMe(){
  const acc = usersMap.get(me.uid) || me;
  paint($("meAva"), acc, me.name);
  $("who").textContent = me.name;
}

function subscribeMessages(){
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  const c = chan();
  $("topName").textContent = "# " + c.name;
  $("topSub").textContent  = c.sub;
  $("input").placeholder   = "Написать в #" + c.name;
  const q = query(
    collection(db, "channels", cur, "messages"),
    orderBy("timestamp", "asc"),
    limit(200)
  );
  unsubMsgs = onSnapshot(q, (snap) => {
    const arr = [];
    snap.forEach(d => {
      const x = d.data();
      arr.push({
        id:   d.id,
        text: x.text,
        uid:  x.uid,
        name: x.name,
        t:    x.timestamp ? x.timestamp.toDate() : new Date()
      });
    });
    renderMsgsFromData(arr);
  }, (err) => {
    console.error("messages snapshot:", err);
    const box = $("msgs"); box.innerHTML = "";
    box.appendChild(el("p","empty","Ошибка загрузки: " + err.message));
  });
}

function renderMsgsFromData(arr){
  lastMessages = arr;
  const box = $("msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = "";
  if (!arr.length){
    box.appendChild(el("p","empty","Здесь пока тихо. Напишите первым."));
    return;
  }
  arr.forEach(m => {
    const acc  = usersMap.get(m.uid) || null;
    const name = acc ? acc.name : m.name;
    const row = el("div","m");
    const a = el("button","ava"); a.type = "button"; paint(a, acc, name);
    a.setAttribute("aria-label","Профиль: " + name);
    a.onclick = () => openProfile(m.uid, name);
    const b = el("div","b"), h = el("div","h");
    const n = el("button","nm", name); n.type = "button";
    n.onclick = () => openProfile(m.uid, name);
    h.appendChild(n);
    h.appendChild(el("time", null, new Date(m.t).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})));
    b.appendChild(h); b.appendChild(el("p", null, m.text));
    row.appendChild(a); row.appendChild(b); box.appendChild(row);
  });
  if (near) box.scrollTop = box.scrollHeight;
}
const renderMsgs = () => renderMsgsFromData(lastMessages);

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("input").value.trim();
  if (!t || !me) return;
  $("input").value = "";
  try {
    await addDoc(collection(db, "channels", cur, "messages"), {
      text: t.slice(0, 2000),
      uid: me.uid,
      name: me.name,
      timestamp: serverTimestamp()
    });
  } catch(err){
    console.error(err);
    $("err").textContent = "Не удалось отправить: " + err.message;
  }
};

$("back").onclick = () => appEl.classList.remove("open");
$("out").onclick  = () => { signOut(auth).catch(e => console.error(e)); };

function closeProfile(){ $("modal").hidden = true; draft = null; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeProfile(); });
$("meBtn").onclick = () => openProfile(me.uid, me.name);

function resize(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 128, c = document.createElement("canvas");
      c.width = c.height = s;
      const k = Math.max(s / img.width, s / img.height);
      const w = img.width * k, h = img.height * k;
      c.getContext("2d").drawImage(img, (s - w)/2, (s - h)/2, w, h);
      cb(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => cb(null);
    img.src = r.result;
  };
  r.onerror = () => cb(null);
  r.readAsDataURL(file);
}

function openProfile(uid, displayName){
  const acc  = usersMap.get(uid) || (me && uid === me.uid ? me : null);
  const mine = me && uid === me.uid;
  const box  = $("pcard"); box.innerHTML = ""; $("modal").hidden = false;
  const pf = el("div","pf");
  const av = el("div","ava l");
  const nm = el("h2", null, acc ? acc.name : displayName);
  pf.appendChild(av); pf.appendChild(nm);
  if (!mine){
    paint(av, acc, displayName);
    pf.appendChild(el("p", null, acc ? (acc.bio || "Описание не указано.") : "Аккаунт не найден."));
    box.appendChild(pf);
    const c1 = el("button","btn ghost full","Закрыть");
    c1.type = "button"; c1.onclick = closeProfile;
    box.appendChild(c1); c1.focus(); return;
  }
  draft = { avatar: acc ? (acc.avatar || "") : "" };
  nm.textContent = "Мой профиль";
  box.appendChild(pf);
  const gb = [];
  function sync(){
    paint(av, draft, me.name);
    gb.forEach(b => b.setAttribute("aria-pressed", String(b.textContent === draft.avatar)));
  }
  const file = el("input"); file.type = "file"; file.accept = "image/*"; file.hidden = true;
  const up   = el("button","btn ghost full","Загрузить фото"); up.type = "button";
  up.onclick = () => file.click();
  const err = el("p","err"); err.setAttribute("role","alert");
  file.onchange = () => {
    const f = file.files[0]; if (!f) return;
    err.textContent = "";
    resize(f, (d) => {
      if (!d){ err.textContent = "Не удалось открыть изображение."; return; }
      draft.avatar = d; sync();
    });
  };
  box.appendChild(file); box.appendChild(up);
  box.appendChild(el("p", null, "Или выберите значок:")).style.margin = ".8rem 0 0";
  const gl = el("div","glyphs");
  GLYPHS.forEach(g => {
    const b = el("button","g", g); b.type = "button";
    b.setAttribute("aria-label","Значок " + g);
    b.onclick = () => { draft.avatar = g; sync(); };
    gb.push(b); gl.appendChild(b);
  });
  box.appendChild(gl);
  const reset = el("button","sm","Сбросить аватарку"); reset.type = "button";
  reset.onclick = () => { draft.avatar = ""; sync(); };
  box.appendChild(reset);
  const lab = el("label", null, "Описание"); lab.style.marginTop = "1rem";
  const ta  = el("textarea"); ta.rows = 3; ta.maxLength = 200; ta.value = acc ? (acc.bio || "") : "";
  lab.appendChild(ta);
  box.appendChild(lab); box.appendChild(err);
  const row = el("div","row");
  const save   = el("button","btn","Сохранить");
  const cancel = el("button","btn ghost","Отмена");
  save.type = "button"; cancel.type = "button"; cancel.onclick = closeProfile;
  save.onclick = async () => {
    save.disabled = true;
    try {
      await setDoc(doc(db, "users", me.uid), {
        avatar: draft.avatar,
        bio: ta.value.trim().slice(0, 200)
      }, { merge: true });
      me.avatar = draft.avatar;
      me.bio    = ta.value.trim().slice(0, 200);
      closeProfile();
    } catch(e){
      err.textContent = "Не удалось сохранить: " + e.message;
    } finally { save.disabled = false; }
  };
  row.appendChild(save); row.appendChild(cancel); box.appendChild(row);
  sync();
}

function hidePw(){
  $("eye").setAttribute("aria-pressed","false");
  $("eye").textContent = "Показать пароль";
  $("p").type = "password"; $("p2").type = "password";
}
$("eye").addEventListener("click", function(){
  const show = $("eye").getAttribute("aria-pressed") !== "true";
  $("eye").setAttribute("aria-pressed", String(show));
  $("eye").textContent = show ? "Скрыть пароль" : "Показать пароль";
  $("p").type  = show ? "text" : "password";
  $("p2").type = show ? "text" : "password";
});
function setMode(m){
  mode = m;
  $("tabIn").setAttribute("aria-selected", m === "in");
  $("tabUp").setAttribute("aria-selected", m === "up");
  $("tabAd").setAttribute("aria-selected", m === "ad");
  $("u").parentNode.hidden = m === "ad"; $("u").required = m !== "ad";
  $("p2row").hidden = m !== "up"; $("p2").required = m === "up";
  $("p").autocomplete = m === "up" ? "new-password" : "current-password";
  $("authBtn").textContent = m === "up" ? "Создать аккаунт" : m === "ad" ? "Открыть" : "Войти";
  $("err").textContent = "";
}
$("tabIn").addEventListener("click", () => setMode("in"));
$("tabUp").addEventListener("click", () => setMode("up"));
$("tabAd").addEventListener("click", () => setMode("ad"));

function adminToggle(on){
  [".tabs","#authForm",".note","#intro"].forEach(s => { document.querySelector(s).hidden = on; });
  $("adminView").hidden = !on;
}
async function showAdmin(){
  adminToggle(true);
  $("adCount").textContent = "Загрузка…";
  $("adList").innerHTML = "";
  try {
    const snap = await getDocs(collection(db, "users"));
    const users = [];
    snap.forEach(d => users.push({ id: d.id, ...d.data() }));
    users.sort((a,b) => (a.name || "").localeCompare(b.name || ""));
    const ul = $("adList"); ul.innerHTML = "";
    users.forEach(u => {
      const li = el("li");
      const a  = el("span","ava s"); paint(a, u, u.name);
      li.appendChild(a);
      li.appendChild(el("span","n", u.name));
      ul.appendChild(li);
    });
    ul.hidden = !users.length;
    $("adCount").textContent = users.length
      ? "Всего аккаунтов: " + users.length
      : "Аккаунтов пока нет.";
  } catch(err){
    console.error(err);
    $("adCount").textContent = "Ошибка загрузки: " + err.message;
  }
}
$("adOut").addEventListener("click", () => { adminToggle(false); setMode("in"); });

$("authForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = $("err"); err.textContent = "";
  const name = $("u").value.trim();
  const pw   = $("p").value;

  if (!window.crypto || !crypto.subtle){
    err.textContent = "Браузер не поддерживает безопасный вход."; return;
  }
  if (mode === "ad"){
    const h = await sha256hex(ADSALT + ":" + pw);
    if (h !== ADHASH){ err.textContent = "Неверный пароль администратора."; return; }
    $("authForm").reset(); hidePw(); showAdmin(); return;
  }
  if (!/^[A-Za-zА-Яа-яЁё0-9_.-]{3,24}$/.test(name)){
    err.textContent = "Имя: 3–24 символа, буквы, цифры, _ . -"; return;
  }
  if (pw.length < 6){
    err.textContent = "Пароль должен быть не короче 6 символов."; return;
  }
  const email = await nameToEmail(name);
  try {
    if (mode === "up"){
      if (pw !== $("p2").value){ err.textContent = "Пароли не совпадают."; return; }
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await setDoc(doc(db, "users", cred.user.uid), {
        name,
        nameLower: name.toLowerCase(),
        avatar: "",
        bio: "",
        createdAt: serverTimestamp()
      });
      $("authForm").reset(); hidePw();
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
      $("authForm").reset(); hidePw();
    }
  } catch(e){
    const code = e.code || "";
    if (code.includes("email-already-in-use"))          err.textContent = "Такое имя уже занято.";
    else if (code.includes("user-not-found") ||
             code.includes("invalid-credential") ||
             code.includes("wrong-password"))            err.textContent = "Неверное имя или пароль.";
    else if (code.includes("weak-password"))             err.textContent = "Пароль слишком простой.";
    else if (code.includes("invalid-email"))             err.textContent = "Имя содержит недопустимые символы.";
    else if (code.includes("too-many-requests"))         err.textContent = "Слишком много попыток. Подождите.";
    else if (code.includes("network-request-failed"))    err.textContent = "Нет связи с сервером. Проверьте интернет.";
    else                                                 err.textContent = "Ошибка: " + (e.message || code);
  }
});

renderList();
setMode("in");
$("u").focus();
</script>
